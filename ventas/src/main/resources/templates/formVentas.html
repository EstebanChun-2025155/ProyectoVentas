<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Venta</title>
    <link rel="stylesheet" th:href="@{/styles/forms.css}">
</head>
<body>

<div class="form-container">

    <div class="form-card">

        <h2 th:text="${venta.codigoVenta != null} ?
                     'Editar Venta' :
                     'Agregar Venta'"></h2>

        <form th:action="${venta.codigoVenta != null} ?
                @{/ventas/actualizar/{id}(id=${venta.codigoVenta})} :
                @{/ventas/guardar}"
              th:object="${venta}" method="post">


            <div class="form-group">
                <label>Fecha</label>
                <input type="date" th:field="*{fechaVenta}" required>
            </div>

            <div class="form-group">
                <label>ID Cliente</label>
                <input type="number" th:field="*{clientesDpiCliente}" required>
            </div>

            <div class="form-group">
                <label>ID Usuario</label>
                <input type="number" th:field="*{usuarioCodigoUsuario}" required>
            </div>

            <div class="form-group">
                <label>Total</label>
                <input type="number" step="0.01" th:field="*{total}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="1">Activa</option>
                    <option value="0">Anulada</option>
                </select>
            </div>

            <button class="form-btn" type="submit"
                    th:text="${venta.codigoVenta != null} ?
                             'Actualizar' : 'Guardar'">
            </button>

        </form>

    </div>

</div>

</body>
</html>
