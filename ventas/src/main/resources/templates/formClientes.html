<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forms Cliente</title>
    <link rel="stylesheet" th:href="@{/styles/forms.css}">
</head>
<body>

<div class="form-container">

    <div class="form-card">
        <h2 th:text="${cliente.dpiCliente != null} ? 'Editar Cliente' : 'Agregar Cliente'"></h2>

        <form th:action="${cliente.dpiCliente != null} ?
                @{/clientes/actualizar/{id}(id=${cliente.dpiCliente})} :
                @{/clientes/guardar}"
              th:object="${cliente}" method="post">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" th:field="*{nombreCliente}" required>
            </div>

            <div class="form-group">
                <label>Apellido</label>
                <input type="text" th:field="*{apellidoCliente}" required>
            </div>

            <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <button class="form-btn" type="submit"
                    th:text="${cliente.dpiCliente != null} ? 'Actualizar' : 'Guardar'">
            </button>

        </form>
    </div>
</div>

</body>
</html>
