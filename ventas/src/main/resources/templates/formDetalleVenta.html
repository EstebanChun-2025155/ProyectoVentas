<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/styles/forms.css}">
</head>
<body>

<div class="form-container">

    <div class="form-card">

        <h2 th:text="${detalleVenta.codigoDetalleVenta != null} ?
                     'Editar Detalle Venta' :
                     'Agregar Detalle Venta'"></h2>

        <form th:action="${detalleVenta.codigoDetalleVenta != null} ?
                @{/detalleVenta/actualizar/{id}(id=${detalleVenta.codigoDetalleVenta})} :
                @{/detalleVenta/guardar}"
              th:object="${detalleVenta}" method="post">

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" th:field="*{cantidad}" min="1" required>
            </div>

            <div class="form-group">
                <label>Precio Unitario</label>
                <input type="number" step="0.01" th:field="*{precioUnitario}" required>
            </div>

            <div class="form-group">
                <label>Subtotal</label>
                <input type="number" step="0.01" th:field="*{subtotal}" required>
            </div>

            <div class="form-group">
                <label>ID Producto</label>
                <input type="number" th:field="*{productosCodigoProducto}" required>
            </div>

            <div class="form-group">
                <label>ID Venta</label>
                <input type="number" th:field="*{ventasCodigoVenta}" required>
            </div>

            <button class="form-btn" type="submit"
                    th:text="${detalleVenta.codigoDetalleVenta != null} ?
                             'Actualizar' : 'Guardar'">
            </button>
        </form>
    </div>

</div>

</body>
</html>
