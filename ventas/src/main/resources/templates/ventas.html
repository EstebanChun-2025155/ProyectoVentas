<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ventas</title>
    <link rel="stylesheet" th:href="@{/styles/ventas.css}">
</head>

<body>

<div class="navbar">
    <h2>Sistema de Ventas</h2>

    <div class="nav-actions">
        <a th:href="@{/home}">Home</a>
        <a href="#">Agregar</a>
        <a href="#">Eliminar</a>
        <a href="#">Buscar</a>
        <a href="#">Editar</a>
    </div>
</div>

<div class="container">

    <h1>Ventas</h1>

    <div class="search-bar">
        <input type="text" placeholder="Buscar venta por ID">
        <button>Buscar</button>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Cliente</th>
            <th>Usuario</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${venta.codigoVenta}"></td>
            <td th:text="${venta.fechaVenta}"></td>
            <td th:text="${venta.total}"></td>
            <td th:text="${venta.estado == 1 ? 'Activo' : 'Inactivo'}"></td>
            <td th:text="${venta.clientesDpiCliente }"></td>
            <td th:text="${venta.usuarioCodigoUsuario }"></td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
