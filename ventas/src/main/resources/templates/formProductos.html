<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Productos</title>
    <link rel="stylesheet" th:href="@{/styles/forms.css}">
</head>
<body>

<div class="form-container">

    <div class="form-card">

        <h2 th:text="${producto.codigoProducto != null} ?
                     'Editar Producto' :
                     'Agregar Producto'"></h2>

        <form th:action="${producto.codigoProducto != null} ?
                @{/productos/actualizar/{id}(id=${producto.codigoProducto})} :
                @{/productos/guardar}"
              th:object="${producto}" method="post">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" th:field="*{nombreProducto}" required>
            </div>

            <div class="form-group">
                <label>Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" required>
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input type="number" th:field="*{stock}" min="0" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <button class="form-btn" type="submit"
                    th:text="${producto.codigoProducto != null} ?
                             'Actualizar' : 'Guardar'">
            </button>
        </form>
    </div>
</div>

</body>
</html>
