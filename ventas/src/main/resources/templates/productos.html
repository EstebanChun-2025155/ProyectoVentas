<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/styles/ventas.css}">
</head>

<body>

<div class="navbar">
    <h2>Sistema de Ventas</h2>

    <div class="nav-actions">
        <a th:href="@{/home}">Home</a>
        <a href="#">Agregar</a>
        <a href="#">Eliminar</a>
        <a href="#">Buscar</a>
        <a href="#">Editar</a>
    </div>
</div>

<div class="container">

    <h1>Productos</h1>

    <div class="search-bar">
        <input type="text" placeholder="Buscar producto por ID">
        <button>Buscar</button>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>Laptop</td>
            <td>Q7,500.00</td>
            <td>10</td>
            <td>Activo</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Mouse</td>
            <td>Q150.00</td>
            <td>50</td>
            <td>Activo</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Teclado</td>
            <td>Q300.00</td>
            <td>30</td>
            <td>Activo</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Monitor</td>
            <td>Q1800.00</td>
            <td>15</td>
            <td>Activo</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
